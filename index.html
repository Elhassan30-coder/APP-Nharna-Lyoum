<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Event App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: sticky tab bar over a single content column; overview splits into a main list and a side column of alerts and cash flow. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F3F6FB; --line:#DDE4F0;
  --ink:#111C33; --muted:#52607A;
  --accent:#1D4ED8; --accent-ink:#FFFFFF; --accent-soft:#E6EEFC; --gold:#E8731A;
  --good:#1E7A4F; --good-soft:#DDF1E6; --warn:#C2410C; --warn-soft:#FFEDD5;
  --bad:#B3261E; --bad-soft:#F9E0DD; --out:#E8731A;
  --font-display:'Bricolage Grotesque','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626; --surface:#172033; --surface-2:#1F2A42; --line:#2E3B58;
    --ink:#EAF0FB; --muted:#A3B1CF;
    --accent:#7FA8FF; --accent-ink:#0F1626; --accent-soft:#1D2D55; --gold:#FFA94D;
    --good:#6FD0A0; --good-soft:#16332A; --warn:#FFB366; --warn-soft:#3A2410;
    --bad:#FF9C8C; --bad-soft:#40201E; --out:#FFA94D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1626; --surface:#172033; --surface-2:#1F2A42; --line:#2E3B58;
  --ink:#EAF0FB; --muted:#A3B1CF;
  --accent:#7FA8FF; --accent-ink:#0F1626; --accent-soft:#1D2D55; --gold:#FFA94D;
  --good:#6FD0A0; --good-soft:#16332A; --warn:#FFB366; --warn-soft:#3A2410;
  --bad:#FF9C8C; --bad-soft:#40201E; --out:#FFA94D; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:1120px;margin-inline:auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.15}
h2{font-size:17px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;color:var(--accent);flex:none}
.brand b{font-family:var(--font-display);font-size:24px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:5px 13px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-block:6px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;padding:8px 13px;border-radius:8px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 0 -2px 0 var(--gold)}
main{display:flex;flex-direction:column;gap:20px;padding-block:20px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel>h2{margin-bottom:12px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.wk-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.wk-h h2{margin:0}.wk-h span{font-size:13px;color:var(--muted)}
.week{display:flex;flex-direction:column}
.wd{display:flex;align-items:center;gap:10px;min-height:36px;padding:5px 8px;border-top:1px solid var(--line);border-radius:0}
.wd:first-child{border-top:0}
.wd.today{background:var(--accent-soft);border-radius:8px;border-top-color:transparent}
.wd.today+.wd{border-top-color:transparent}
.week .wd:first-child{margin-top:0}
.wd-h{flex:none;width:104px;display:flex;align-items:baseline;gap:5px}
.wd-h span{flex:none;width:36px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.wd.today .wd-h span{color:var(--accent);font-weight:700}
.wd-h b{font-family:var(--font-display);font-size:15px;line-height:1.1}
.wd-h small{font-size:11px;color:var(--muted)}
.wd-b{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px}
.wev{display:flex;align-items:baseline;gap:6px;max-width:100%;min-width:0;text-align:start;font:inherit;font-size:12px;color:var(--ink);background:var(--surface-2);border:0;border-inline-start:3px solid var(--accent);border-radius:6px;padding:3px 8px;cursor:pointer}
.wd.today .wev{background:var(--surface)}
.wev.quote{border-inline-start-color:var(--out)}
.wev:hover strong{color:var(--accent)}
.wev strong,.wev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wev span{color:var(--muted);font-size:11px}
.wfree{margin:0;font-size:12px;color:var(--muted)}
.sv{font-size:13px;color:var(--muted);margin:0;overflow-wrap:anywhere}.sv a{color:var(--accent);text-decoration:none}.sv a:hover{text-decoration:underline}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat-tile{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-width:0;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;font:inherit;color:inherit}
.cat-tile:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(15,22,38,.08)}
.cat-tile .ci{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:20px}
.cat-tile h3{font-size:16px;line-height:1.2;overflow-wrap:anywhere;margin-bottom:4px}
.cat-tile .cs{font-size:12px;color:var(--muted);line-height:1.5}
.cat-tile .pill{margin-top:6px;font-size:11px;padding:1px 8px}
.cat-tile.add{align-items:center;justify-content:center;border-style:dashed;color:var(--accent);font-weight:600;text-align:center}
.cat-tile.add .ci{background:none;font-size:28px;font-weight:400}
.cat-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px}
.cat-t{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:start}
.cat-t h3{font-size:18px}.cat-ar{color:var(--muted);width:14px;display:inline-block}
.cat-s{font-size:13px;flex:1 1 200px;min-width:0}
.catblk .tablewrap{margin-top:12px}.catblk .empty{margin:12px 0 0}
.fpos{color:var(--good)}.fneg{color:var(--bad)}
.fnote{margin:10px 0 0;font-size:12px;color:var(--muted)}
.wtag{margin-inline-start:auto;font-style:normal;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.kpi b{display:block;font-family:var(--font-display);font-size:24px;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.kpi b.neg{color:var(--bad)}

.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:start;cursor:pointer}
.row:first-of-type{border-top:0}
.row:hover .mn strong{color:var(--accent)}
.dt{width:52px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;background:var(--surface-2)}
.dt b{display:block;font-family:var(--font-display);font-size:20px;line-height:1.1}
.dt span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mn{display:flex;flex-direction:column;gap:4px;min-width:0}
.mn strong{overflow-wrap:anywhere}
.mn .muted{font-size:13px}
.bl{text-align:end;font-size:14px;font-weight:600}
.bl small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill.quote{background:var(--warn-soft);color:var(--warn)}
.pill.confirmed,.pill.good{background:var(--good-soft);color:var(--good)}
.pill.done{background:var(--accent-soft);color:var(--accent)}
.pill.cancelled,.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.worn{background:var(--warn-soft);color:var(--warn)}

.al-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.al{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:14px}
.al i{flex:none;width:8px;height:8px;border-radius:50%;background:currentColor;margin-top:7px}
.al.bad{background:var(--bad-soft);color:var(--bad)}
.al.warn{background:var(--warn-soft);color:var(--warn)}
.al.info{background:var(--accent-soft);color:var(--accent)}
.al.ok{background:var(--good-soft);color:var(--good)}

.chart{display:flex;align-items:flex-end;gap:10px;height:140px;border-bottom:1px solid var(--line);border-top:1px dashed var(--line)}
.chart .m{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%;min-width:0}
.chart .m i{display:block;width:40%;max-width:18px;min-height:2px;border-radius:3px 3px 0 0}
.chart .in{background:var(--accent)}
.chart .out{background:var(--out)}
.chartx{display:flex;gap:10px;margin-top:4px}
.chartx span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.ymax{font-size:11px;color:var(--muted);margin-bottom:4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card-h>div{min-width:0}
.card h3{overflow-wrap:anywhere}
.card .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px}
.card-f{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.sums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:14px;font-weight:600}
.sums small{display:block;color:var(--muted);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.tags{display:flex;gap:6px;flex-wrap:wrap}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
th{text-align:start;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:first-child td{border-top:0}
th.n,td.n{text-align:end;font-variant-numeric:tabular-nums}
tfoot td{font-weight:600;background:var(--surface-2)}
.sub{font-family:var(--font-display);font-size:17px;margin:4px 0 -8px}

.demo{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);color:var(--accent);padding:10px 14px;border-radius:10px;font-size:14px}
.demo.warnbar{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--muted);padding:8px 0;font-size:14px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
label{font-size:13px;font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;width:100%;min-width:0}
input[type="checkbox"]{width:auto;min-height:0}
textarea{resize:vertical}
.hint{color:var(--muted);font-size:12px;font-weight:400}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fs{border:1px solid var(--line);border-radius:10px;padding:12px;margin:16px 0 0;min-width:0}
.fs legend{font-size:13px;font-weight:600;padding-inline:6px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:500;cursor:pointer}
.err{color:var(--bad);font-size:14px;margin-top:12px}
.sheet-f{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:16px}
.grp{display:flex;gap:8px;flex-wrap:wrap}

#modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scrim{position:absolute;inset:0;background:rgba(15,22,38,.55)}
.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:100%;display:flex;flex-direction:column}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sheet-b{padding:16px;overflow:auto}
.toast{position:fixed;inset-inline:0;bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:30;padding-inline:16px}
.toast span{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500}
.bk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.bk-grid .panel{display:flex;flex-direction:column;gap:12px}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

.flip{display:inline-block}
[dir="rtl"] .flip{transform:scaleX(-1)}
.calnav{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.calgrid .wd{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:8px 2px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.cell{min-height:96px;padding:4px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cell.out{background:var(--bg);opacity:.6}
.cell.clash{box-shadow:inset 0 0 0 2px var(--warn)}
.dn{font-size:12px;font-weight:600;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.cell.today .dn{background:var(--accent);color:var(--accent-ink)}
.evc{display:block;width:100%;text-align:start;border:0;font:inherit;font-size:11px;font-weight:600;padding:2px 5px;border-radius:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evc.confirmed{background:var(--accent);color:var(--accent-ink)}
.evc.quote{background:var(--warn-soft);color:var(--warn);outline:1px dashed var(--warn);outline-offset:-1px}
.evc.done{background:var(--good-soft);color:var(--good)}
.more{font-size:11px;color:var(--muted)}
#attwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.att{border-collapse:separate;border-spacing:0;min-width:0;width:auto}
table.att th,table.att td{padding:0;border-top:1px solid var(--line);border-bottom:0;text-align:center}
table.att thead th{padding:8px 0;min-width:30px;font-size:11px}
table.att th.nm,table.att td.nm{position:sticky;inset-inline-start:0;background:var(--surface);text-align:start;padding:8px 12px;min-width:130px;z-index:1;border-inline-end:1px solid var(--line)}
table.att td.tot{padding:8px 12px;white-space:nowrap;text-align:end}
.ab{width:30px;height:36px;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;position:relative;padding:0}
.ab.we{background:var(--surface-2)}
.ab.p{background:var(--good-soft);color:var(--good)}
.ab.h{background:var(--warn-soft);color:var(--warn)}
.ab.a{background:var(--bad-soft);color:var(--bad)}
.ab.ev::after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2px;border-radius:50%;background:var(--accent)}
@media (max-width:520px){.cell{min-height:60px;padding:2px}.evc{height:7px;padding:0;font-size:0;border-radius:3px}}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.fgrid{grid-template-columns:minmax(0,1fr)}h1{font-size:24px}.sums{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer;padding:0}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn svg{width:18px;height:18px}
.htools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo-img{width:36px;height:36px;object-fit:contain;flex:none;border-radius:6px}
.logo-img.wide{width:auto;height:46px;max-width:90px}
.ic{width:18px;height:18px;flex:none}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:env(safe-area-inset-top,0px);padding-block:18px;display:flex;flex-direction:column;gap:14px;max-height:100vh;overflow-y:auto}
.side nav.tabs{position:static;flex-direction:column;overflow:visible;border-bottom:0;padding:0;background:none;gap:2px}
.side nav.tabs a{display:flex;align-items:center;gap:10px}
.content{min-width:0}
.wrap.wide{max-width:1360px}
@media (max-width:820px){.shell{display:block}.side{display:contents}.side nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);flex-direction:row;overflow-x:auto;border-bottom:1px solid var(--line);padding-block:6px;background:var(--bg)}.side .brand{padding-block:18px 6px}}
.sf{position:relative;flex:1 1 220px;max-width:320px}
.sf svg{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.sf input{padding-inline-start:32px}
.gs-res{display:flex;flex-direction:column;margin-top:12px}
.gs-g{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 2px}
.gs-i{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:start;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;padding:10px 0;cursor:pointer}
.gs-i:hover strong{color:var(--accent)}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ph:empty{display:none}
.ph figure{position:relative;margin:0;width:84px;height:84px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.ph button{position:absolute;top:3px;inset-inline-end:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(15,22,38,.7);color:#fff;font-size:15px;line-height:1;cursor:pointer;padding:0}
.strip{display:flex;gap:6px;align-items:center}
.strip button{border:0;padding:0;background:none;cursor:pointer;line-height:0}
.strip img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.strip img.thumb{width:38px;height:38px}
.strip span{font-size:13px;color:var(--muted)}
.viewer img{width:100%;max-height:70vh;object-fit:contain;border-radius:8px;background:var(--surface-2);display:block}
.stars{color:var(--out);letter-spacing:2px;font-size:15px;white-space:nowrap}
.stars-in{display:flex;gap:2px}
.stars-in button{border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);opacity:.45;padding:2px 3px;min-width:32px;min-height:36px}
.stars-in button.on{color:var(--out);opacity:1}
.lbl{font-size:13px;font-weight:600}
.rv-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.rv{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:13px}
.lgprev{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lgprev img{max-height:64px;max-width:160px;object-fit:contain;border:1px solid var(--line);border-radius:8px;padding:4px;background:#fff}
.steps{margin:8px 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
@media (max-width:520px){.rv-grid{grid-template-columns:minmax(0,1fr)}}
</style>

/* ---------- derived values ---------- */
function paidOf(id){return sum(db.advances.filter(function(a){return a.clientId===id}),function(a){return a.amount})}
function confirmedUpcoming(){
  var td=today();
  return db.clients.filter(function(c){return c.status==='confirmed'&&c.date>=td}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
}
function clashDates(){
  var m={};confirmedUpcoming().forEach(function(c){m[c.date]=(m[c.date]||0)+1});
  var out={};Object.keys(m).forEach(function(k){if(m[k]>1)out[k]=m[k]});return out;
}
function stockUsage(){
  var per={},peak={};
  confirmedUpcoming().forEach(function(c){
    c.lines.forEach(function(l){
      var k=c.date+'|'+l.itemId;
      per[k]=per[k]||{date:c.date,itemId:l.itemId,need:0};
      per[k].need+=num(l.qty);
    });
  });
  var shortages=[];
  Object.keys(per).forEach(function(k){
    var x=per[k],it=byId(db.items,x.itemId);if(!it)return;
    peak[x.itemId]=Math.max(peak[x.itemId]||0,x.need);
    if(x.need>it.qty)shortages.push({date:x.date,item:it,short:x.need-it.qty});
  });
  shortages.sort(function(a,b){return a.date<b.date?-1:1});
  return {peak:peak,shortages:shortages};
}
function buyList(){
  var u=stockUsage(),auto={};
  u.shortages.forEach(function(s){auto[s.item.id]=Math.max(auto[s.item.id]||0,s.short)});
  var out=[];
  db.items.forEach(function(i){
    var manual=num(i.toBuy),a=auto[i.id]||0,q=Math.max(manual,a);
    if(q>0)out.push({item:i,qty:q,fromEvents:a>manual,cost:q*num(i.cost)});
  });
  return out;
}
function demoCount(){
  return ['clients','advances','items','staff','suppliers','expenses','attendance','stats'].reduce(function(n,k){return n+db[k].filter(function(x){return x.demo}).length},0);
}

}

function curLogo(){return db.meta.logo||DEFAULT_LOGO}
function logoHTML(){
  var lg=curLogo();
  return '<img class="logo-img'+(db.meta.logo?'':' wide')+'" src="'+esc(lg)+'" alt="">';
}
function brandHTML(){
  var nm=(db.meta.company&&db.meta.company.name)||t('brand');
  return '<div class="brand">'+logoHTML()+'<div><b>'+esc(nm)+'</b><small>'+esc(t('tag'))+'</small></div></div>';
}
function toolsHTML(){
  var seg=['en','fr','ar'].map(function(l){return '<button type="button" data-act="lang" data-v="'+l+'" lang="'+l+'" aria-pressed="'+(l===lang)+'">'+(l==='ar'?'ع':l.toUpperCase())+'</button>'}).join('');
  return '<div class="htools"><button type="button" class="ibtn" data-act="search" aria-label="'+esc(t('search.open'))+'" title="'+esc(t('search.open'))+' (/)">'+icon(ICO.search)+'</button><div class="seg" role="group" aria-label="'+esc(t('language'))+'">'+seg+'</div></div>';
}
function header(){
  return '<header class="top">'+(layout==='side'?'<span></span>':brandHTML())+toolsHTML()+'</header>';
}
function nav(){
  return '<nav class="tabs" aria-label="Menu">'+VIEWS.map(function(v){return '<a href="#'+v+'"'+(v===view?' aria-current="page"':'')+'>'+(layout==='side'?icon(ICO[v]):'')+esc(t('nav.'+v))+'</a>'}).join('')+'</nav>';
}
function banners(){
  var h='';
  if(!storageOK)h+='<div class="demo warnbar">'+esc(t('banner.storage'))+'</div>';
  if(storageOK&&storageFull)h+='<div class="demo warnbar">'+esc(t('err.quota'))+'</div>';
  if(demoCount()>0)h+='<div class="demo"><span>'+esc(t('banner.demo'))+'</span><button type="button" class="btn sm" data-act="remove-demo">'+esc(t('banner.remove'))+'</button></div>';
  return h;
}

/* ---------- views ---------- */
function alerts(){
  var td=today(),out=[],cl=clashDates(),u=stockUsage();
  Object.keys(cl).sort().forEach(function(d){out.push({lvl:'warn',html:esc(t('al.clash',{date:dparts(d).full,n:cl[d]}))})});
  u.shortages.forEach(function(s){out.push({lvl:'bad',html:esc(t('al.short',{item:s.item.name,n:s.short,date:dparts(s.date).full}))})});
  var in7=addDays(7),in14=addDays(14);
  db.clients.forEach(function(c){
    var bal=c.total-paidOf(c.id);
    if(c.status==='cancelled')return;
    if(c.status==='done'&&c.date<td&&c.date>=addDays(-30)&&!(c.review&&(c.review.overall||c.review.comment)))out.push({lvl:'info',html:esc(t('al.review',{client:c.name}))});
    if((c.status==='confirmed'||c.status==='done')&&c.date<td&&bal>0)out.push({lvl:'bad',html:esc(t('al.past',{client:c.name,amount:moneyTxt(bal)}))});
    else if(c.status==='confirmed'&&c.date>=td&&c.date<=in7&&bal>0)out.push({lvl:'warn',html:esc(t('al.due',{client:c.name,amount:moneyTxt(bal),date:dparts(c.date).full}))});
    else if(c.status==='quote'&&c.date>=td&&c.date<=in14)out.push({lvl:'info',html:esc(t('al.quote',{client:c.name,date:dparts(c.date).full}))});
  });
  var real=db.clients.some(function(c){return !c.demo});
  var lb=db.meta.lastBackup;
  if(real&&(!lb||lb<addDays(-14)))out.push({lvl:'info',html:esc(t('al.backup'))+' <a href="#backup">'+esc(t('al.backupLink'))+'</a>'});
  var rank={bad:0,warn:1,info:2};
  out.sort(function(a,b){return rank[a.lvl]-rank[b.lvl]});
  return out;
}
function cashChart(){
  var now=new Date(),ms=[];
  for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}
  var data=ms.map(function(k){return {k:k,inn:sum(db.advances.filter(function(a){return a.date.slice(0,7)===k}),function(a){return a.amount}),out:sum(db.expenses.filter(function(e){return e.date.slice(0,7)===k}),function(e){return e.amount})}});
  var max=Math.max.apply(null,[1].concat(data.map(function(d){return d.inn}),data.map(function(d){return d.out})));
  var cols=data.map(function(d){
    var tip=esc(monthLabel(d.k)+' — '+t('legend.in')+': '+moneyTxt(d.inn)+' · '+t('legend.out')+': '+moneyTxt(d.out));
    return '<div class="m" title="'+tip+'"><i class="in" style="height:'+(d.inn/max*100)+'%"></i><i class="out" style="height:'+(d.out/max*100)+'%"></i></div>';
  }).join('');
  var labels=data.map(function(d){var p=d.k.split('-').map(Number);return '<span>'+esc(new Intl.DateTimeFormat(LOC[lang],{month:'short'}).format(new Date(p[0],p[1]-1,1)))+'</span>'}).join('');
  return '<div class="ymax">'+esc(t('chart.max',{v:moneyTxt(max)}))+'</div><div class="chart" role="img" aria-label="'+esc(t('h.cashflow'))+'">'+cols+'</div><div class="chartx">'+labels+'</div>'+
    '<div class="legend"><span><b style="background:var(--accent)"></b>'+esc(t('legend.in'))+'</span><span><b style="background:var(--out)"></b>'+esc(t('legend.out'))+'</span></div>';
}
function weekHTML(){
  var td=today(),end=addDays(6),n=0,cols='';
  var evs=db.clients.filter(function(c){return c.status!=='cancelled'&&c.date>=td&&c.date<=end});
  for(var i=0;i<7;i++){
    var ds=addDays(i),dp=dparts(ds);
    var list=evs.filter(function(c){return c.date===ds});n+=list.length;
    cols+='<div class="wd'+(i===0?' today':'')+'"><div class="wd-h"><span>'+esc(dp.wd)+'</span><b>'+esc(dp.day)+'</b><small>'+esc(dp.mon)+'</small></div><div class="wd-b">'+

/* ---------- finance ---------- */
function finCalc(P){
  var inP=function(d){return P==='all'||String(d).slice(0,7)===P};
  var evs=db.clients.filter(function(c){return (c.status==='confirmed'||c.status==='done')&&inP(c.date)});
  var ids={};evs.forEach(function(c){ids[c.id]=1});
  var rows=evs.map(function(c){
    var linked=db.expenses.filter(function(e){return e.clientId===c.id});
    var cost=sum(linked,function(e){return e.amount}),paid=paidOf(c.id);
    return {c:c,linked:linked,cost:cost,margin:c.total-cost,paid:paid,left:Math.max(0,c.total-paid)};
  }).sort(function(a,b){return a.c.date<b.c.date?1:a.c.date>b.c.date?-1:0});
  var other=db.expenses.filter(function(e){return !ids[e.clientId]&&inP(e.date)});
  var revenue=sum(rows,function(r){return r.c.total});
  var linkedCost=sum(rows,function(r){return r.cost});
  var otherCost=sum(other,function(e){return e.amount});
  var charges=linkedCost+otherCost;
  var byCat={};
  rows.forEach(function(r){r.linked.forEach(function(e){byCat[e.category]=(byCat[e.category]||0)+e.amount})});
  other.forEach(function(e){byCat[e.category]=(byCat[e.category]||0)+e.amount});
  return {rows:rows,revenue:revenue,linkedCost:linkedCost,otherCost:otherCost,charges:charges,profit:revenue-charges,
    evMargin:revenue-linkedCost,byCat:byCat,
    collected:sum(db.advances.filter(function(a){return inP(a.date)}),function(a){return a.amount}),
    outstanding:sum(rows,function(r){return r.left})};
}
function pctTxt(v){return '<bdi class="num">'+esc(fmtNum(Math.round(v))+' %')+'</bdi>'}
function signCls(v){return v<0?' class="fneg"':(v>0?' class="fpos"':'')}

  var cost=num(ui.simCost),m=num(ui.simM);
  if(cost<=0||m<0||m>=100)return '<p class="muted">'+esc(t('sim.hint'))+'</p>';
  var price=cost/(1-m/100);
  return '<div class="sums" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px"><div><small>'+esc(t('sim.price'))+'</small>'+money(Math.round(price))+'</div><div><small>'+esc(t('sim.profit'))+'</small>'+money(Math.round(price-cost))+'</div></div>';
}

function mondayOf(s){var d=parseD(s),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d}

function viewCalendar(){
  var ref=parseD(ui.calRef),cl=clashDates(),td=today(),mode=ui.calMode,from,to,title,mk=ref.getFullYear()+'-'+pad(ref.getMonth()+1);
  if(mode==='month'){
    var first=new Date(ref.getFullYear(),ref.getMonth(),1),last=new Date(ref.getFullYear(),ref.getMonth()+1,0);
    from=mondayOf(isoDate(first));var lm=mondayOf(isoDate(last));to=new Date(lm);to.setDate(lm.getDate()+6);
    title=monthLabel(mk);
  }else{
    from=mondayOf(ui.calRef);to=new Date(from);to.setDate(from.getDate()+6);
    title=dparts(isoDate(from)).full+' – '+dparts(isoDate(to)).full;
  }
  var fs=isoDate(from),ts=isoDate(to);
  var evs=db.clients.filter(function(c){return c.status!=='cancelled'&&c.date>=fs&&c.date<=ts}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  var body='';
  if(mode==='month'){
    var cells='',d=new Date(from);
    wdNames().forEach(function(n){cells+='<div class="wd">'+esc(n)+'</div>'});
    while(isoDate(d)<=ts){
      var s=isoDate(d),inM=d.getMonth()===ref.getMonth(),day=evs.filter(function(c){return c.date===s});
      cells+='<div class="cell'+(inM?'':' out')+(s===td?' today':'')+(cl[s]?' clash':'')+'"><span class="dn">'+d.getDate()+'</span>'+day.slice(0,3).map(evBtn).join('')+(day.length>3?'<span class="more">'+esc(t('cal.more',{n:day.length-3}))+'</span>':'')+'</div>';
      d.setDate(d.getDate()+1);
    }
    var inMonth=evs.filter(function(c){return c.date.slice(0,7)===mk});
    body='<div class="calgrid" role="group" aria-label="'+esc(title)+'">'+cells+'</div>'+
      '<div class="legend"><span><b style="background:var(--accent)"></b>'+esc(t('st.confirmed'))+'</span><span><b style="background:var(--warn-soft);outline:1px dashed var(--warn)"></b>'+esc(t('st.quote'))+'</span><span><b style="background:var(--good-soft)"></b>'+esc(t('st.done'))+'</span></div>'+

  }else{
    var wk='';
    for(var i=0;i<7;i++){
      var dd=new Date(from);dd.setDate(from.getDate()+i);
      var s2=isoDate(dd),day2=evs.filter(function(c){return c.date===s2});

    '<div class="calnav"><div class="grp"><button type="button" class="btn sm" data-act="cal-prev" aria-label="'+esc(t('cal.prev'))+'"><span class="flip">‹</span></button><button type="button" class="btn sm" data-act="cal-today">'+esc(t('cal.today'))+'</button><button type="button" class="btn sm" data-act="cal-next" aria-label="'+esc(t('cal.next'))+'"><span class="flip">›</span></button></div><h2>'+esc(title)+'</h2><div class="seg" role="group"><button type="button" data-act="cal-mode" data-v="month" aria-pressed="'+(mode==='month')+'">'+esc(t('cal.month'))+'</button><button type="button" data-act="cal-mode" data-v="week" aria-pressed="'+(mode==='week')+'">'+esc(t('cal.week'))+'</button></div></div>'+body;

function daysIn(mk){var p=mk.split('-').map(Number);return new Date(p[0],p[1],0).getDate()}
function fmtD(n){return new Intl.NumberFormat(LOC[lang],{maximumFractionDigits:1}).format(n)}
function viewAttendance(){
  var mk=ui.attMonth,n=daysIn(mk),py=mk.split('-').map(Number),am={},assigned={};
  db.attendance.forEach(function(a){am[a.staffId+'|'+a.date]=a});
  db.clients.forEach(function(c){if(c.status==='confirmed')c.staffIds.forEach(function(s){assigned[s+'|'+c.date]=1})});
  var list=db.staff.slice().sort(function(a,b){return a.name.localeCompare(b.name,lang)});
  var head='<tr><th class="nm">'+esc(t('att.staff'))+'</th><th>'+esc(t('att.days'))+'</th><th>'+esc(t('att.due'))+'</th><th></th>';
  for(var d=1;d<=n;d++)head+='<th>'+d+'</th>';
  head+='</tr>';
  var rows=list.map(function(s){
    var days=0,cells='';
    for(var d=1;d<=n;d++){
      var ds=mk+'-'+pad(d),a=am[s.id+'|'+ds],st=a?a.st:'',wd=new Date(py[0],py[1]-1,d).getDay();
      if(st==='present')days+=1;else if(st==='half')days+=0.5;
      cells+='<td><button type="button" class="ab '+(st?st.charAt(0):'')+(assigned[s.id+'|'+ds]?' ev':'')+((wd===0||wd===6)?' we':'')+'" data-act="att" data-staff="'+s.id+'" data-date="'+ds+'" aria-label="'+esc(s.name+', '+dparts(ds).full+': '+(st?t('att.'+st):'—'))+'">'+(st==='present'?'✓':st==='half'?'½':st==='absent'?'✗':'')+'</button></td>';

function fallbackSave(o){

      var u=URL.createObjectURL(new Blob([o.data],{type:mime+';charset=utf-8'})),a=document.createElement('a');
      a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},1500);res();
    }catch(e){rej(e)}
  });

function readImage(file,max,q,type){
  return new Promise(function(res,rej){
    var r=new FileReader();r.onerror=rej;
    r.onload=function(){
      var im=new Image();im.onerror=rej;
      im.onload=function(){
        var s=Math.min(1,max/Math.max(im.width,im.height,1)),w=Math.max(1,Math.round(im.width*s)),h=Math.max(1,Math.round(im.height*s)),cv=document.createElement('canvas');
        cv.width=w;cv.height=h;var cx=cv.getContext('2d');
        if(!type){cx.fillStyle='#fff';cx.fillRect(0,0,w,h)}
        cx.drawImage(im,0,0,w,h);
        try{res(cv.toDataURL(type||'image/jpeg',q))}catch(e){rej(e)}
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

/* social media */
var LINKS=['instagram','facebook','tiktok','whatsapp','website'];
function socialUrl(k,v){
  v=String(v||'').trim();if(!v)return '';
  if(/^https?:\/\//i.test(v))return v;
  if(k==='whatsapp'){var dg=v.replace(/\D/g,'');if(dg.charAt(0)==='0')dg='212'+dg.slice(1);return dg?'https://wa.me/'+dg:''}
  if(/^[a-z][a-z0-9+.-]*:/i.test(v))return '';
  if(/^[\w-]+(\.[\w-]+)+(\/|$)/.test(v))return 'https://'+v;
  var h=v.replace(/^@/,'');
  if(k==='instagram')return 'https://instagram.com/'+encodeURIComponent(h);
  if(k==='facebook')return 'https://facebook.com/'+encodeURIComponent(h);
  if(k==='tiktok')return 'https://tiktok.com/@'+encodeURIComponent(h);
  return 'https://'+encodeURIComponent(h);
}

function followersSeries(){
  var months=[],pls=[];
  db.stats.forEach(function(s){if(months.indexOf(s.month)<0)months.push(s.month);if(pls.indexOf(s.platform)<0)pls.push(s.platform)});
  months.sort();
  return months.map(function(mk){
    var tot=0;
    pls.forEach(function(p){var best=null;db.stats.forEach(function(s){if(s.platform===p&&s.month<=mk&&s.followers>0&&(!best||s.month>best.month))best=s});if(best)tot+=best.followers});
    return {k:mk,v:tot};
  });
}
function statsByMonth(){
  var m={};
  db.stats.forEach(function(s){var o=m[s.month]||(m[s.month]={reach:0,eng:0,msgs:0});o.reach+=s.reach;o.eng+=s.engagement;o.msgs+=s.messages});
  return Object.keys(m).sort().map(function(k){return {k:k,reach:m[k].reach,eng:m[k].eng,msgs:m[k].msgs}});
}
function sourceRows(){
  var m={};
  db.clients.forEach(function(c){
    if(c.status==='cancelled'||!c.source)return;
    var o=m[c.source]||(m[c.source]={n:0,won:0,rev:0,rs:0,rn:0});
    o.n++;
    if(c.status==='confirmed'||c.status==='done'){o.won++;o.rev+=c.total}
    if(c.review&&c.review.overall>0){o.rs+=c.review.overall;o.rn++}
  });
  return Object.keys(m).sort(function(a,b){return m[b].rev-m[a].rev||m[b].n-m[a].n}).map(function(k){return {k:k,o:m[k]}});
}
